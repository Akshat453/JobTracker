# Runs the reminder email job every hour. Vercel's free plan only allows a once-a-day cron job, so
# without this, reminders added during the day aren't emailed until the next morning.
#
# Setup (GitHub repo → Settings → Secrets and variables → Actions → New repository secret):
#   SITE_URL     your site, e.g. https://jobtracker-xxxx.vercel.app (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
name: Reminder emails

on:
  schedule:
    - cron: '17 * * * *' # every hour at :17 (GitHub may start it a few minutes late)
  workflow_dispatch: {} # "Run workflow" button for testing

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger reminder job
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Add SITE_URL and CRON_SECRET as repository secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders"
          echo
